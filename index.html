<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last 5 Days · Skills Bank</title>
<style>
:root{--navy:#080828;--teal:#40BDA9;--teal-d:#1E8C7B;--ice:#EBF4FF;--coral:#F26A44;--muted:#5B6485;--line:#CBD9F2;--white:#fff;--green:#2FB67C}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;background:var(--ice);color:var(--navy);font-size:16px;line-height:1.45}
header.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
header.top img{height:34px}
header.top .t{font-weight:700;font-size:18px;letter-spacing:.01em}
header.top .sub{color:var(--teal);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
header.top nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
header.top nav a{color:#fff;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25)}
header.top nav a.on{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:18px}
h1{font-size:28px;margin:6px 0 4px}h2{font-size:20px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 2px 8px rgba(8,8,40,.05)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g3{grid-template-columns:repeat(3,1fr)}@media(max-width:480px){.g3 .tile{padding:10px 6px}.g3 .tile .v{font-size:27px}.g3 .tile .k{font-size:10px;letter-spacing:.05em}.g3 .tile .d{font-size:11px}}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--teal);color:var(--navy)}
.btn.sec{background:var(--white);border:1px solid var(--line);color:var(--navy)}
.btn.dark{background:var(--navy);color:#fff}.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--navy);max-width:100%}
textarea{width:100%;min-height:78px}
label{font-size:13px;font-weight:700;color:var(--teal-d);letter-spacing:.06em;text-transform:uppercase;display:block;margin:0 0 4px}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.tile{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.tile .k{font-size:12px;font-weight:700;color:var(--teal-d);letter-spacing:.1em;text-transform:uppercase}
.tile .v{font-size:34px;font-weight:700;line-height:1.1}.tile .d{font-size:13px;color:var(--muted)}
.tile.hid .v{color:#9AA7C7}.tile.hid{background:#F4F7FC;border-style:dashed}
.pos{color:var(--teal-d)}.neg{color:var(--coral)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--navy);cursor:pointer;margin:0 0 8px}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--teal);background:#E3F6F2}.opt.sel .l{background:var(--teal);color:var(--navy)}
.opt:disabled{cursor:default;opacity:.8}
.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.pill.t{background:var(--teal);color:var(--navy)}
.code{font-family:"DejaVu Sans Mono",Consolas,monospace;font-weight:700;background:var(--ice);padding:3px 8px;border-radius:6px}
.big{font-size:54px;font-weight:700;letter-spacing:.12em}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:var(--navy);color:#fff;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
td.lab{text-align:start;font-weight:700;background:var(--ice)}
.scroll{overflow-x:auto}
.note{font-size:13px;color:var(--muted)}
.callout{border-left:5px solid var(--teal);background:#E3F6F2;border-radius:8px;padding:10px 14px;font-weight:700}
.bar{display:flex;align-items:end;gap:6px;height:140px}.bar div{flex:1;border-radius:6px 6px 0 0;min-height:2px}
details summary{cursor:pointer;font-weight:700}
.proj table{font-size:26px}.proj th{font-size:18px}.proj td{padding:12px}
.warn{border-left:6px solid var(--coral);background:#FFF4EF;border-radius:12px;padding:14px 16px;margin:12px 0}
.warn h2{margin:0 0 6px;display:flex;align-items:center;gap:10px}.warn .bang{flex:none;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.warn table td,.warn table th{font-size:14px}.up{color:var(--teal-d);font-weight:700}.down{color:var(--coral);font-weight:700}
.tile .d.up,.tile .d.down{font-size:14px}
/* ---- game feel ---- */
.enter{animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn,.opt,.tile{transition:transform .15s ease,box-shadow .15s ease,background .2s,border-color .2s}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(8,8,40,.18)}.btn:not(:disabled):active{transform:scale(.97)}
.opt:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(8,8,40,.12);border-color:var(--teal)}
.opt.sel{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.025)}100%{transform:scale(1)}}
.btn.go:not(:disabled){animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(64,189,169,.55)}50%{box-shadow:0 0 0 10px rgba(64,189,169,0)}}
.stagger{opacity:0;animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}
.unlock,.flip{animation:flipIn .75s cubic-bezier(.2,.8,.2,1) both}
@keyframes flipIn{0%{opacity:0;transform:perspective(600px) rotateY(-90deg) scale(.9)}60%{opacity:1;transform:perspective(600px) rotateY(12deg)}100%{opacity:1;transform:perspective(600px) rotateY(0)}}
.tile.unlock{position:relative;overflow:hidden}
.tile.unlock::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);transform:translateX(-120%);animation:shine 1s .6s ease forwards}
@keyframes shine{to{transform:translateX(120%)}}
.warn.alert{animation:slideDown .5s cubic-bezier(.2,.8,.2,1) both,glowRed 1.2s .5s ease-in-out 3}
@keyframes slideDown{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
@keyframes glowRed{0%,100%{box-shadow:0 0 0 0 rgba(242,106,68,0)}50%{box-shadow:0 0 0 9px rgba(242,106,68,.28)}}
.warn.alert .bang{animation:bangPulse 1s ease-in-out 4}
@keyframes bangPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
.stamp{display:inline-block;animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-12deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
.cnt.fu{color:var(--green)}.cnt.fd{color:var(--coral)}
.track{display:flex;align-items:center;margin:10px 0 2px}
.track .n{flex:none;width:32px;height:32px;border-radius:50%;background:#E3E9F5;color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .4s}
.track .n.done{background:var(--teal);color:var(--navy)}.track .n.cur{background:var(--navy);color:#fff;animation:curPulse 1.6s infinite}
.track .seg{flex:1;height:4px;background:#E3E9F5;position:relative;overflow:hidden}.track .seg i{position:absolute;inset:0;background:var(--teal);transform-origin:left;transform:scaleX(0);transition:transform .8s ease}.track .seg.full i{transform:scaleX(1)}
@keyframes curPulse{0%,100%{box-shadow:0 0 0 0 rgba(8,8,40,.35)}50%{box-shadow:0 0 0 7px rgba(8,8,40,0)}}
#splash{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;animation:splash 1.6s ease forwards}
#splash .d{font-size:clamp(56px,15vw,130px);font-weight:700;letter-spacing:.06em;color:var(--teal);line-height:1}
#splash .s{font-size:clamp(18px,4.2vw,32px);opacity:.92;margin-top:10px;text-align:center;padding:0 22px}
#splash.hot .d{color:var(--coral)}
@keyframes splash{0%{opacity:0;transform:scale(1.06)}16%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.98)}}
#toasts{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;border-left:5px solid var(--teal);border-radius:10px;padding:10px 14px;font-weight:700;box-shadow:0 6px 18px rgba(8,8,40,.3);animation:toast 3.4s ease forwards}
@keyframes toast{0%{opacity:0;transform:translateX(30px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateX(20px)}}
.gauge{height:18px;background:#E3E9F5;border-radius:9px;overflow:hidden;margin:8px 0}.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:9px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
header.top .snd{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
header.top .snd.on{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.stagger{opacity:1!important}#splash{display:none}}
#alertmodal{position:fixed;inset:0;z-index:70;background:rgba(8,8,40,.94);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:18px;animation:fadeIn .35s ease both}
#alertmodal .box{background:#fff;border-radius:18px;border:4px solid var(--coral);max-width:640px;width:100%;margin:auto;padding:22px 20px;text-align:center;animation:alertIn .5s cubic-bezier(.2,1.2,.3,1) both,alertGlow 1.1s .5s ease-in-out 4}
#alertmodal .bang{width:64px;height:64px;border-radius:50%;background:var(--coral);color:#fff;font-size:44px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;animation:bangPulse .9s ease-in-out infinite}
#alertmodal h1{color:var(--coral);letter-spacing:.14em;margin:4px 0 8px;font-size:34px}
#alertmodal .lead2{font-size:21px;font-weight:700;margin:0 0 6px}
#alertmodal table{margin:12px 0;text-align:start}#alertmodal td{font-size:15px}
#alertmodal .btn{background:var(--coral);color:#fff;font-size:17px;padding:12px 22px;margin-top:6px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes alertIn{0%{opacity:0;transform:scale(.7) rotate(-2deg)}60%{opacity:1;transform:scale(1.04) rotate(1deg)}100%{transform:none}}
@keyframes alertGlow{0%,100%{box-shadow:0 0 0 0 rgba(242,106,68,0)}50%{box-shadow:0 0 0 14px rgba(242,106,68,.35)}}
.pre .unlock,.pre .warn.alert,.pre .stagger{animation-play-state:paused!important}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff}
.chip.live{background:#E3F6F2;border-color:var(--teal);color:var(--teal-d)}.chip.off{background:#FFF1EC;border-color:var(--coral);color:#B2401F}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle}
td.fresh select{background:#E3F6F2;border-color:var(--teal)}
@media(max-width:640px){.big{font-size:40px}h1{font-size:23px}main{padding:12px}}
/* ---- right-to-left (Arabic) ---- */
html[dir=rtl] body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",Calibri,Carlito,sans-serif}
html[dir=rtl] *{letter-spacing:0!important}
html[dir=rtl] label,html[dir=rtl] th,html[dir=rtl] .tag,html[dir=rtl] .k{text-transform:none}
html[dir=rtl] svg{direction:ltr}
html[dir=rtl] header.top nav{margin-left:0;margin-right:auto}
html[dir=rtl] .callout{border-left:0;border-right:5px solid var(--teal)}
html[dir=rtl] .warn{border-left:1px solid var(--line);border-right:6px solid var(--coral)}
html[dir=rtl] .sig{border-left:1px solid var(--line);border-right:5px solid var(--red)}
html[dir=rtl] .sig.ctx{border-right-color:#F2B544}
html[dir=rtl] .cardk .face.sigf,html[dir=rtl] .cardk .face.greenf{border-left-width:2px;border-right-width:6px}
html[dir=rtl] .tilew.found,html[dir=rtl] .tilew.missedw{border-left:1px solid var(--line);border-right:6px solid var(--red)}
html[dir=rtl] .tilew.missedw{border-right-color:#F2B544}
html[dir=rtl] .toast{border-left:0;border-right:5px solid var(--teal)}
html[dir=rtl] #toasts{right:auto;left:14px}
html[dir=rtl] td.lab,html[dir=rtl] .opt,html[dir=rtl] .cardk .face,html[dir=rtl] #alertmodal table{text-align:right}
html[dir=rtl] .dot{margin-left:0;margin-right:6px}
html[dir=rtl] .dist .c,html[dir=rtl] .board .c,html[dir=rtl] .hb .ct{text-align:left}
header.top .lang{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
header.top .lang:hover{background:rgba(255,255,255,.12)}

</style>

const LANG_KEY = "l5.lang";
const AR_RE = I18N.re.map(([s,r])=>[new RegExp(s),r]);
const AR_HTML = I18N.html.map(([s,r,isRe])=>[isRe?new RegExp(s,"g"):s,r,isRe]);
let LANG = (()=>{ const q=new URLSearchParams(location.search).get("lang")||new URLSearchParams((location.hash.split("?")[1])||"").get("lang");
  if(q==="ar"||q==="en"){ try{ localStorage.setItem(LANG_KEY,JSON.stringify(q)); }catch(e){} return q; }
  try{ return JSON.parse(localStorage.getItem(LANG_KEY)||"null")==="ar" ? "ar" : "en"; }catch(e){ return "en"; } })();
const isAr = () => LANG==="ar";
function applyDir(){ document.documentElement.lang=LANG; document.documentElement.dir=isAr()?"rtl":"ltr"; document.title=isAr()?I18N.title:I18N.titleEn; }
const daysAr = n => n===1 ? "يوم واحد" : (n===2 ? "يومان" : n+" أيام");
function trCore(core){
  if(I18N.exact[core]!==undefined) return I18N.exact[core];
  for(const [re,rep] of AR_RE){ const m=re.exec(core); if(m) return rep.replace(/\$([DT]?)(\d)/g,(_,k,i)=>{ const v=m[+i]; return k==="D" ? daysAr(+v) : (k==="T" ? trCore(v) : v); }); }
  if(core.includes(", ")){ const ps=core.split(", "); if(ps.every(p=>I18N.exact[p]!==undefined)) return ps.map(p=>I18N.exact[p]).join("، "); }
  return core;
}
function trText(s){ if(!isAr() || !s) return s; const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s); return m[1]+trCore(m[2])+m[3]; }
const ISO_RE = /(?:https?|file):\/\/[^\s<]+|[A-Za-z][A-Za-z0-9_'’\-\.]*(?: [A-Za-z0-9][A-Za-z0-9_'’\-\.%]*)*\??|[↑↓→]\s?[+−]?\d+%?|\d+%?(?: → \d+%?)+/g;
function mapText(html, fn){
  const parts=html.split(/(<[^>]*>)/); let inTa=false;
  for(let i=0;i<parts.length;i++){ const p=parts[i];
    if(p[0]==="<"){ if(/^<\/textarea/i.test(p)) inTa=false; else { if(/^<textarea/i.test(p)) inTa=true; parts[i]=fn.tag?fn.tag(p):p; } continue; }
    if(!inTa) parts[i]=fn.text(p); }
  return parts.join("");
}
function trHtml(html){
  if(!isAr()) return html;
  for(const [p,r,isRe] of AR_HTML) html = isRe ? html.replace(p,r) : html.split(p).join(r);
  html = mapText(html, {text:trText, tag:t=>t.replace(/\b(placeholder|title)="([^"]*)"/g,(m,a,v)=>a+'="'+trText(v)+'"')});
  return mapText(html, {text:t=>t.replace(ISO_RE,'<bdi dir="ltr">$&</bdi>')});
}
applyDir();
function trSplash(s){ if(!isAr()) return s; if(/^left · /.test(s)) return trText("left")+" · "+trText(s.slice(7)); return trText(s); }

/* ===================== helpers ===================== */
const BASE = {T: 82, C: 75, Tr: 75};
const LETTERS = ["A","B","C","D"];
const FAC_PIN = "2026";                         // code to open the facilitator pages (change it here if you want another one)
const RELAY_DEFAULT = "https://ntfy.sh/";       // free public relay used for live sync between devices
const REVEAL_DEFAULT = 2;                       // capacity / trust become visible when the group reaches round 2 (Day 4)
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sgn = v => v>0 ? "+"+v : (v<0 ? "\u2212"+Math.abs(v) : "0");
const cls = v => v>0 ? "pos" : (v<0 ? "neg" : "");
function load(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* total after applying rounds 1..upto (missing rounds are skipped) */
function totals(choices, upto){
  let T=BASE.T, C=BASE.C, Tr=BASE.Tr;
  for(let i=0;i<Math.min(upto, DATA.rounds.length);i++){
    const ch = choices[i]; if(!ch) continue;
    const o = DATA.rounds[i].options[LETTERS.indexOf(ch)]; if(!o) continue;
    T+=o.target; C+=o.capacity; Tr+=o.trust;
  }
  return {T, C, Tr, R: Math.round((T+C+Tr)/3)};
}
const doneCount = ch => ch.filter(Boolean).length;
const isComplete = ch => ch.length>=5 && ch.slice(0,5).every(Boolean);
function toCode(n, ch){ return "G"+n+"-"+Array.from({length:5},(_,i)=>ch[i]||"-").join("").replace(/-+$/,""); }
function fromCode(s){
  const m = /^\s*G\s*(\d{1,2})\s*-\s*([A-Da-d\-]{0,5})\s*$/i.exec(s||""); if(!m) return null;
  const arr = m[2].toUpperCase().split("").map(c=>c==="-"?null:c); while(arr.length<5) arr.push(null);
  return {n:+m[1], ch:arr};
}
function roundCode(session, r){ let h=5381; const s=(session||"").toUpperCase()+"|"+r; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))>>>0; return String(1000+(h%9000)); }
function copy(text, btn){ (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).catch(()=>{ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy");}catch(e){} t.remove(); }).finally(()=>{ if(btn){ const o=btn.textContent; btn.textContent=trText("Copied"); setTimeout(()=>btn.textContent=o,1200);} }); }

/* ===================== state ===================== */
const randSession = () => { const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; };
let FAC = load("l5.fac", {session:randSession(), groups:5, cur:0, reveal:REVEAL_DEFAULT, codes:true, proj:false, choices:{}, online:{}});
FAC.online = FAC.online || {};
let GRP = load("l5.grp", {n:null, session:"", reveal:REVEAL_DEFAULT, codes:true, choices:[], unlocked:0, notes:{}, sent:{}, splashed:{}, warned:{}});
GRP.sent = GRP.sent || {};
const saveFac = () => save("l5.fac", FAC), saveGrp = () => save("l5.grp", GRP);
const facChoices = n => (FAC.choices[n] = FAC.choices[n] || [null,null,null,null,null]);

/* ===================== live sync (free public relay: ntfy.sh) ===================== */
const hash6 = s => { let h=5381; for(const c of String(s)) h=((h<<5)+h+c.charCodeAt(0))>>>0; return h.toString(36).padStart(6,"0").slice(-6); };
const topicOf = s => "sb-l5-"+String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")+"-"+hash6("sb"+String(s||"").toUpperCase());
function relayBase(){ const q=new URLSearchParams(location.search).get("relay")||new URLSearchParams((location.hash.split("?")[1])||"").get("relay")||RELAY_DEFAULT; return q.endsWith("/")?q:q+"/"; }
const SYNC = {es:null, topic:"", last:null, status:"off", timer:null, session:"", role:"", seen:new Set()};
function setStatus(st){ SYNC.status=st; const el=$("#syncchip"); if(el){ el.className="chip "+(st==="live"?"live":"off"); el.textContent=trText(st==="live"?"Live sync: connected":(st==="connecting"?"Live sync: connecting…":"Live sync: offline (use the codes)")); } }
function syncStop(){ if(SYNC.es){ SYNC.es.close(); SYNC.es=null; } clearTimeout(SYNC.timer); SYNC.status="off"; SYNC.session=""; SYNC.role=""; }
function syncStart(session, role){
  if(!session) return; if(SYNC.session===session && SYNC.role===role && (SYNC.es||SYNC.timer)) return;
  syncStop(); SYNC.session=session; SYNC.role=role; SYNC.topic=topicOf(session); SYNC.t0=Date.now()-1500; SYNC.last=null; SYNC.seen=new Set(); setStatus("connecting"); syncConnect();
}
function syncConnect(){
  if(!SYNC.session) return;
  const url=relayBase()+SYNC.topic+"/sse"+(SYNC.last?("?since="+SYNC.last):"?since=all");
  let es; try{ es=new EventSource(url); }catch(e){ setStatus("off"); return; }
  SYNC.es=es;
  es.onopen=()=>{ SYNC.fail=0; setStatus("live"); };
  es.onmessage=ev=>{ try{ const m=JSON.parse(ev.data); if(m.event && m.event!=="message") return; if(m.id){ if(SYNC.seen.has(m.id)) return; SYNC.seen.add(m.id); SYNC.last=m.id; } const p=JSON.parse(m.message); onSyncMessage(p); }catch(e){} };
  es.onerror=()=>{ SYNC.fail=(SYNC.fail||0)+1; setStatus(SYNC.fail>=2?"off":"connecting"); try{es.close();}catch(e){} SYNC.es=null; SYNC.timer=setTimeout(syncConnect,2500); };
}
async function syncSend(p){ if(!SYNC.topic) return false; try{ const r=await fetch(relayBase()+SYNC.topic,{method:"POST",body:JSON.stringify(Object.assign({ts:Date.now()},p))}); return r.ok; }catch(e){ return false; } }
let softTimer=null, FRESH_T=0;
function softRender(force){ const wait=1800-(Date.now()-FRESH_T); if(!force && !REDUCED() && wait>0){ clearTimeout(softTimer); softTimer=setTimeout(softRender,wait+50); return; }
   const a=document.activeElement; if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $("#app").contains(a)){ clearTimeout(softTimer); softTimer=setTimeout(softRender,1500); return; } route(); }
const FRESH = {};
function onSyncMessage(p){
  if(SYNC.role==="fac"){
    if(p.t==="hello"){ FAC.online[p.g]=p.ts||1; if(p.ts>SYNC.t0){ toast("Group "+p.g+" joined"); sfx("ping"); } }
    else if(p.t==="choice" && p.g>=1 && p.g<=8){ if(p.g>FAC.groups) FAC.groups=p.g; facChoices(p.g)[p.r-1]=p.c; FRESH[p.g+"-"+(p.r-1)]=Date.now(); setTimeout(softRender,3300); if(p.ts>SYNC.t0){ toast("Group "+p.g+" locked "+dlabel(DATA.rounds[p.r-1].day)+" · "+p.c); sfx("ping"); } }
    else if(p.t==="set" && p.g>=1 && p.g<=8){ const c=fromCode("G"+p.g+"-"+p.ch); if(c) FAC.choices[p.g]=c.ch; }
    else if(p.t==="cur"){ FAC.cur=p.cur; }
    else return;
    saveFac(); softRender();
  } else if(SYNC.role==="group" && GRP.n){
    if(p.t==="cur"){ GRP.cur=p.cur; GRP.unlocked=Math.max(GRP.unlocked,p.cur); saveGrp(); softRender(true); return; }
    else if(p.t==="settings"){ if(p.reveal) GRP.reveal=p.reveal; if(typeof p.codes==="boolean") GRP.codes=p.codes; }
    else if(p.t==="set" && p.g===GRP.n){ const c=fromCode("G"+p.g+"-"+p.ch); if(c){ GRP.choices=c.ch; GRP.unlocked=Math.max(GRP.unlocked,doneCount(c.ch)); } }
    else if(p.t==="choice" && p.g===GRP.n){ GRP.choices[p.r-1]=p.c; }
    else return;
    saveGrp(); softRender();
  }
}

/* ===================== game feel: motion, counters, sound ===================== */
const dlabel = d => d===1 ? "1 Day" : d+" Days";               // countdown wording: 5 Days, 4 Days … 1 Day
const REDUCED = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const STATS = {enter:0, sfx:[], splash:0};
let LAST_KEY = "", ANIM_NOW = false, PREV = {};
let AC = null, MASTER = null;
/* sound is ON by default on every screen; the switch in the top bar turns it off for that device and the choice is remembered */
function soundEnabled(){ const v=load("l5.snd",null); return v!==null ? v : true; }
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); MASTER=AC.createGain(); MASTER.gain.value=.9; MASTER.connect(AC.destination); }catch(e){ return null; } } if(AC.state==="suspended") AC.resume(); return AC; }
function tone(f,t,d,type="sine",v=.12,glide){ const T=AC.currentTime+t, o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,T); if(glide) o.frequency.exponentialRampToValueAtTime(glide,T+d);
  g.gain.setValueAtTime(.0001,T); g.gain.linearRampToValueAtTime(v,T+.012); g.gain.exponentialRampToValueAtTime(.0001,T+d); o.connect(g); g.connect(MASTER); o.start(T); o.stop(T+d+.05); }
function whoosh(t,d,from,to,v=.16){ const T=AC.currentTime+t, len=Math.floor(AC.sampleRate*d), buf=AC.createBuffer(1,len,AC.sampleRate), data=buf.getChannelData(0); for(let i=0;i<len;i++) data[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=buf; const f=AC.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.1; f.frequency.setValueAtTime(from,T); f.frequency.exponentialRampToValueAtTime(to,T+d);
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,T); g.gain.linearRampToValueAtTime(v,T+d*.35); g.gain.exponentialRampToValueAtTime(.0001,T+d); src.connect(f); f.connect(g); g.connect(MASTER); src.start(T); }
const PENTA=[523,587,659,698];
function sfx(name, arg){
  if(!soundEnabled()) return; STATS.sfx.push(name); if(!audio()) return;
  switch(name){
    case "tap":   tone(900,0,.035,"triangle",.05); break;
    case "tick":  tone(880,0,.05,"sine",.1); break;
    case "pick":  tone(PENTA[arg||0],0,.09,"triangle",.13); tone(PENTA[arg||0]*2,.04,.06,"sine",.05); break;
    case "lock":  tone(120,0,.2,"sine",.3,55); tone(440,.05,.1,"triangle",.12); tone(660,.14,.2,"triangle",.12); break;
    case "day": { whoosh(0,.5,250,2600,.18); tone(90,.05,.4,"sine",.3,45); const n=arg||1; for(let i=0;i<n;i++) tone(760,.5+i*.16,.07,"square",.05); tone(n===1?220:988,.5+n*.16,.35,"triangle",.1); break; }
    case "warn":  for(let i=0;i<3;i++){ tone(520,i*.36,.17,"sawtooth",.06,330); tone(330,i*.36+.18,.17,"sawtooth",.06,220); } tone(60,0,1.1,"sine",.22,40); break;
    case "flip":  whoosh(0,.3,500,3000,.08); tone(1200+(arg||0)*220,.12,.16,"sine",.07); break;

const cntQ=(...a)=>cnt(...a).replace('class="cnt"','class="cnt" data-quiet="1"');
const cnt=(key,to,from,pre="",suf="%")=>`<span class="cnt" data-k="${key}" data-to="${to}" data-from="${from===undefined?to:from}" data-pre="${pre}" data-suf="${suf}">${pre}${to}${suf}</span>`;
function runFx(fresh){
  let ups=0, downs=0;
  document.querySelectorAll(".cnt").forEach(el=>{
    const to=+el.dataset.to, key=el.dataset.k, pre=el.dataset.pre||"", suf=el.dataset.suf||"";
    const was=PREV[key];
    let from = (fresh && el.dataset.from!==undefined) ? +el.dataset.from : ((was!==undefined && was!=="?") ? +was : to);
    if(was==="?"){ const c=el.closest("td,.tile"); if(c && !REDUCED()) c.classList.add("flip"); from=to; }
    PREV[key]=to;
    if(from===to || REDUCED()) return;
    const t0=performance.now(), dur=950, up=to>from; if(!el.dataset.quiet){ up?ups++:downs++; } el.classList.add(up?"fu":"fd"); el.textContent=pre+from+suf;
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=pre+Math.round(from+(to-from)*e)+suf; if(k<1) requestAnimationFrame(step); else el.classList.remove("fu","fd"); };
    requestAnimationFrame(step);
  });
  if(ups||downs) sfx(ups>=downs?"countUp":"countDown");
  document.querySelectorAll(".q").forEach(el=>{ PREV[el.dataset.k]="?"; });
  document.querySelectorAll(".gauge i").forEach(i=>{ if(REDUCED()) i.style.width=i.dataset.w+"%"; else setTimeout(()=>{ i.style.width=i.dataset.w+"%"; },350); });
}

}

  if(r>5){
    const t=totals(ch,5);
    const ft=(i,label,key,v,from)=>`<div class="tile ${ANIM_NOW?"stagger":""}" style="animation-delay:${(i*0.45).toFixed(2)}s"><div class="k">${label}</div><div class="v">${cntQ(key,v,from)}</div></div>`;
    return shell(`${top}<h1>Final reveal</h1><p class="lead">Here is what really happened.</p>
    <div class="grid g3">${ft(0,"Target","fT",t.T,BASE.T)}${ft(1,"Capacity","fC",t.C,BASE.C)}${ft(2,"Trust","fTr",t.Tr,BASE.Tr)}</div>
    <div class="callout ${ANIM_NOW?"stagger":""}" style="margin:12px 0;animation-delay:1.6s">Real Target (average of Target, Capacity and Trust): ${cntQ("fR",t.R,0)}<div class="gauge"><i data-w="${Math.min(100,t.R)}"></i></div></div>
    <a class="btn" href="#/aftermath">Continue to the Aftermath (1.1)</a>`, "#/group");
  }
  const rd=DATA.rounds[r-1], needCode = GRP.codes && GRP.unlocked<r;
  if(needCode){
    return shell(`${top}${r===1?briefing():""}${groupTiles(ch,r)}<div class="card" style="margin-top:12px"><h2>${r===1?"Waiting for the facilitator":"Next up: "+dlabel(rd.day)}</h2><p>Your facilitator will open ${dlabel(rd.day)} for everyone. This screen updates by itself.</p>
    <details><summary>Not updating? Enter the code instead</summary><div class="row" style="margin-top:8px"><input data-act="gcode" inputmode="numeric" maxlength="4" placeholder="4-digit code" size="8"><button class="btn" data-act="unlock">Open ${dlabel(rd.day)}</button></div><p class="note" id="gmsg"></p></details></div>`, "#/group");
  }
  const sel = GRP.pick;
  return shell(`${top}${r===GRP.reveal?warnCard(ch,r):""}${groupTiles(ch,r)}
  <div class="card" style="margin-top:12px"><span class="pill">${dlabel(rd.day)}</span><h2 style="margin-top:8px">${esc(rd.name)}</h2><p>${esc(rd.scenario)}</p><label>Choose ONE action</label>
  ${rd.options.map((o,i)=>`<button class="opt ${sel===LETTERS[i]?"sel":""}" data-act="pick" data-l="${LETTERS[i]}"><span class="l">${LETTERS[i]}</span><span>${esc(o.text)}</span></button>`).join("")}
  <div class="row"><button class="btn go" data-act="lock" ${sel?"":"disabled"}>Lock in our choice</button><span class="note">${r>=GRP.reveal?"You will see every effect straight away.":"You will see the effect on the Target straight away."}</span></div></div>`, "#/group");
}
const sentText=(i,ch)=>GRP.sent&&GRP.sent[i+1]?"Sent to your facilitator ✓":"Not sent yet. If it stays like this, tell your facilitator the code "+toCode(GRP.n,ch)+".";
function viewResult(){ /* shown right after locking a choice */
  const ch=GRP.choices, i=doneCount(ch)-1, rd=DATA.rounds[i], o=rd.options[LETTERS.indexOf(ch[i])], b=totals(ch,i), t=totals(ch,i+1), all=(i+1)>=GRP.reveal;
  const st=(n)=>ANIM_NOW?`class="tile stagger" style="animation-delay:${(0.25+n*0.18).toFixed(2)}s"`:`class="tile"`;
  const eff=(n,label,key,delta,from,to)=>`<div ${st(n)} data-fx="${delta>0?"pos":(delta<0?"neg":"zero")}"><div class="k">${label}</div><div class="v ${dcls(delta)}">${arrow(delta)} ${cntQ("r"+i+key,Math.abs(delta),0,delta>0?"+":(delta<0?"\u2212":""),"%")}</div><div class="d">${delta===0?"no change":(delta>0?"increased":"decreased")} · ${from}% → ${to}%</div></div>`;
  const next = i+1<5 ? "Wait for the facilitator to open the next day." : "The final reveal is next.";
  const sent = `<span id="sentnote">${sentText(i,ch)}</span>`;
  const body = all
    ? `<div class="grid g3">${eff(0,"Target attainment","T",o.target,b.T,t.T)}${eff(1,"Team capacity","C",o.capacity,b.C,t.C)}${eff(2,"Team trust","Tr",o.trust,b.Tr,t.Tr)}</div>
       <p class="note" style="margin-top:12px">${sent} You now see everything move as you decide. ${next}</p>`
    : `<div style="max-width:320px">${(()=>{ const d=o.target; return `<div ${st(0)} data-fx="${d>0?"pos":(d<0?"neg":"zero")}"><div class="k">Target attainment</div><div class="v ${cls(d)}">${arrow(d)} ${cntQ("r"+i+"T",Math.abs(d),0,d>0?"+":(d<0?"\u2212":""),"%")}</div><div class="d">Target now ${t.T}%</div></div>`; })()}</div>
       <p class="note" style="margin-top:12px">${sent} ${next}</p>`;
  return shell(`<div class="card"><span class="pill">${dlabel(rd.day)} · your choice ${ch[i]}</span> <span class="${ANIM_NOW?"stamp":""} pill t" style="margin-left:6px">Locked in ✓</span><p style="margin:10px 0">${esc(o.text)}</p>${body}
   <a class="btn" href="#/group" data-act="next" style="margin-top:8px;display:inline-block">${i+1<5?"Continue":"Go to the final reveal"}</a></div>`, "#/group");
}

/* ---------- aftermath (1.1) ---------- */
function viewAftermath(){
  if(!GRP.n || !isComplete(GRP.choices)) return shell(`<h1>Aftermath (1.1)</h1><div class="card"><p>Finish the five days first, then come back here.</p><a class="btn" href="#/group">Back to the simulation</a></div>`, "#/aftermath");
  const ch=GRP.choices, t=totals(ch,5), N=GRP.notes;
  const decisions=DATA.rounds.map((r,i)=>{const o=r.options[LETTERS.indexOf(ch[i])];return `<tr><td class="lab">${dlabel(r.day)}</td><td>${ch[i]}</td><td style="text-align:start">${esc(o.text)}</td><td class="${cls(o.target)}">${sgn(o.target)}</td><td class="${cls(o.capacity)}">${sgn(o.capacity)}</td><td class="${cls(o.trust)}">${sgn(o.trust)}</td></tr>`;}).join("");
  const ta=(k,l)=>`<div><label>${l}</label><textarea data-act="note" data-k="${k}">${esc(N[k]||"")}</textarea></div>`;
  return shell(`<h1>The Performance Aftermath</h1><p class="lead">Group ${GRP.n} · Real Target ${t.R}% (Target ${t.T}% · Capacity ${t.C}% · Trust ${t.Tr}%)</p>
  <div class="card"><h2>What happened</h2>${lineChart(ch)}<div class="scroll"><table><tr><th>Days left</th><th>Option</th><th>Action</th><th>Target</th><th>Capacity</th><th>Trust</th></tr>${decisions}</table></div></div>
  <div class="grid g2"><div class="card"><h2>WHAT?</h2><p class="note">What decisions did we make? What happened to the target? What happened to capacity and trust?</p>${ta("what","Our answer")}</div>
   <div class="card"><h2>SO WHAT?</h2><p class="note">Which decisions looked successful at first but became expensive later? What leadership behavior did we overuse? What did we stop doing because of pressure?</p>${ta("sowhat","Our answer")}</div>
   <div class="card"><h2>NOW WHAT?</h2><p class="note">What should a sales manager monitor besides target attainment? Which behavior would you change if you replayed the simulation? How can a leader create pressure without draining the system?</p>${ta("nowwhat","Our answer")}</div></div>
  <div class="card"><h2>Keep · Stop · Start <span class="note">(one item each)</span></h2><div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
   <div><label>Keep: what should we continue doing?</label><input style="width:100%" data-act="note" data-k="keep" value="${esc(N.keep||"")}"></div>
   <div><label>Stop: what should we stop overusing?</label><input style="width:100%" data-act="note" data-k="stop" value="${esc(N.stop||"")}"></div>
   <div><label>Start: what should we add to protect sustainable performance?</label><input style="width:100%" data-act="note" data-k="start" value="${esc(N.start||"")}"></div></div>
   <p style="margin-top:12px"><button class="btn sec sm" data-act="copynotes">Copy our answers</button></p></div>
  <div class="callout">Achieved performance is not the same as sustained performance. If the team hits the target but loses the capacity to repeat it, the business may be paying for performance twice.</div>`, "#/aftermath");
}
function viewCompare(){
  const groups=Array.from({length:FAC.groups},(_,i)=>[i+1,facChoices(i+1)]).filter(([n,ch])=>doneCount(ch)>0);
  if(!groups.length) return shell(`<h1>Compare groups (1.1)</h1><div class="card"><p>No choices entered yet. Enter or import them in the Facilitator console.</p></div>`, "#/compare");
  const rows=groups.map(([n,ch])=>{const t=totals(ch,5);return `<tr><td class="lab">Group ${n}</td><td>${ch.map(c=>c||"—").join(" ")}</td><td>${t.T}%</td><td>${t.C}%</td><td>${t.Tr}%</td><td><b>${t.R}%</b></td></tr>`;}).join("");
  const best=[...groups].sort((a,b)=>totals(b[1],5).T-totals(a[1],5).T)[0], low=[...groups].sort((a,b)=>totals(a[1],5).C-totals(b[1],5).C)[0];
  return shell(`<h1>Compare groups</h1><p class="lead">Use this screen for the Performance Aftermath debrief.</p>
  <div class="card"><div class="scroll"><table><tr><th></th><th>Choices (5 → 1 Days)</th><th>Target</th><th>Capacity</th><th>Trust</th><th>Real Target</th></tr>${rows}</table></div>
  <p class="note">Highest Target: Group ${best[0]} (${totals(best[1],5).T}%). Lowest Capacity: Group ${low[0]} (${totals(low[1],5).C}%).</p></div>
  ${barChart(groups)}
  <div class="grid g2"><div class="card"><h2>WHAT?</h2><ul><li>What decisions did we make?</li><li>What happened to the target?</li><li>What happened to capacity and trust?</li></ul></div>
  <div class="card"><h2>SO WHAT?</h2><ul><li>Which decisions looked successful at first but became expensive later?</li><li>What leadership behavior did we overuse?</li><li>What did we stop doing because of pressure?</li></ul></div>
  <div class="card"><h2>NOW WHAT?</h2><ul><li>What should a sales manager monitor besides target attainment?</li><li>Which behavior would you change if you replayed the simulation?</li><li>How can a leader create pressure without draining the system?</li></ul></div></div>
  <div class="callout">Achieved performance is not the same as sustained performance. If the team hits the target but loses the capacity to repeat it, the business may be paying for performance twice.</div>`, "#/compare");
}

/* ===================== router + events ===================== */
let SHOW_RESULT=false;
function screenKey(path){
  if(path==="#/group"){ if(!GRP.n) return "g-join"; const ch=GRP.choices, k=doneCount(ch), r=Math.min(k+1,6); if(SHOW_RESULT && k>0) return "g-res-"+k; if(r>5) return "g-final"; return "g-"+r+"-"+((GRP.codes && GRP.unlocked<r)?"lock":"play"); }
  return path;
}
const facOK = () => sessionStorage.getItem("l5.ok")==="1";
let TOKEN=0;
function splashFor(path, fresh){
  if(!(fresh && path==="#/group" && GRP.n && !SHOW_RESULT)) return null;
  const r=Math.min(doneCount(GRP.choices)+1,6); if(r>5 || (GRP.codes && GRP.unlocked<r)) return null;
  GRP.splashed=GRP.splashed||{}; if(GRP.splashed[r]) return null; GRP.splashed[r]=true; saveGrp();
  const rd=DATA.rounds[r-1], hot=r===GRP.reveal;
  return {big: rd.day===1?"1 DAY":rd.day+" DAYS", small:"left · "+(hot?"watch out":rd.name), hot, day:rd.day, r};
}
function afterRender(path, fresh){
  if(!fresh || !(path==="#/group" && GRP.n)) return;
  const k=doneCount(GRP.choices), r=Math.min(k+1,6);
  if(SHOW_RESULT && k>0){ sfx("lock"); document.querySelectorAll("[data-fx]").forEach((el,i)=>setTimeout(()=>sfx(el.dataset.fx),300+i*180)); }
  else if(r>5){ sfx("fanfare"); [0,1,2].forEach(i=>setTimeout(()=>sfx("tile",i),200+i*450)); setTimeout(()=>sfx("sweep"),1700); }
  else if(r===GRP.reveal && !(GRP.codes && GRP.unlocked<r)){ [1,2].forEach(i=>setTimeout(()=>sfx("flip",i),300+i*220)); }
}
function route(){
  const raw=location.hash||"#/"; const [path,qs]=raw.split("?"); const q=Object.fromEntries(new URLSearchParams(qs||""));
  let html;
  if((path==="#/facilitator"||path==="#/compare") && !facOK()){ syncStop(); $("#app").innerHTML=trHtml(viewGate(path)); const i=$("[data-act=pin]"); if(i) i.focus(); return; }
  if(path==="#/facilitator"||path==="#/compare") syncStart(FAC.session,"fac");
  else if((path==="#/group"||path==="#/aftermath") && GRP.n && GRP.session) syncStart(GRP.session,"group");
  else syncStop();
  const key=screenKey(path), fresh = key!==LAST_KEY; ANIM_NOW = fresh && !REDUCED();
  if(path==="#/facilitator") html=viewFacilitator();
  else if(path==="#/group") html=SHOW_RESULT && GRP.n && doneCount(GRP.choices)>0 ? viewResult() : viewGroup(q);
  else if(path==="#/aftermath") html=viewAftermath();
  else if(path==="#/compare") html=viewCompare();
  else html=viewHome();
  html = trHtml(html);
  const sp = REDUCED() ? null : splashFor(path, fresh);
  const commit=()=>{
    $("#app").innerHTML=html; setStatus(SYNC.status); LAST_KEY=key; if(fresh) FRESH_T=Date.now();
    if(fresh && !REDUCED()){ const m=$("#app main"); if(m){ m.classList.add("enter"); STATS.enter++; } }
    const needAlert = fresh && path==="#/group" && GRP.n && alertNeeded();
    const m=$("#app main"); if(m && (needAlert || HOLD)) m.classList.add("pre");
    if(needAlert){ HOLD=true; STATS.alerts=(STATS.alerts||0)+1; const old=$("#alertmodal"); if(old) old.remove(); document.body.insertAdjacentHTML("beforeend", trHtml(alertHtml(GRP.choices, Math.min(doneCount(GRP.choices)+1,6)))); sfx("warn"); return; }
    runFx(fresh); afterRender(path, fresh);
  };
  if(sp){ const tok=++TOKEN; LAST_KEY=key; FRESH_T=Date.now(); showSplash(sp.big, sp.small, sp.hot); sfx("day",sp.day); if(sp.hot) setTimeout(()=>sfx("warn"),900); setTimeout(()=>{ if(tok===TOKEN) commit(); },1250); return; }
  TOKEN++; commit();
}
window.addEventListener("hashchange",()=>{ SHOW_RESULT=false; route(); });
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act; if(!["pick","lock","snd"].includes(a)) sfx("tap");
  if(a==="copycode"){ copy(toCode(+b.dataset.g, facChoices(+b.dataset.g)), b); return; }
  if(a==="copylink"){ copy($(".code[style*='break-all']").textContent, b); return; }
  if(a==="opencur"){ FAC.cur=+b.dataset.v; saveFac(); route(); syncSend({t:"cur",cur:FAC.cur}); syncSend({t:"settings",reveal:FAC.reveal,codes:FAC.codes}); return; }
  if(a==="gotit"){ const r=Math.min(doneCount(GRP.choices)+1,6); GRP.warned=GRP.warned||{}; GRP.warned[r]=true; saveGrp(); HOLD=false; const md=$("#alertmodal"); if(md) md.remove(); const mm=$("#app main"); if(mm) mm.classList.remove("pre"); runFx(true); afterRender("#/group", true); return; }
  if(a==="lang"){ LANG=isAr()?"en":"ar"; try{ localStorage.setItem(LANG_KEY,JSON.stringify(LANG)); }catch(e){} applyDir(); const md=$("#alertmodal"); if(md){ md.remove(); document.body.insertAdjacentHTML("beforeend", trHtml(alertHtml(GRP.choices, Math.min(doneCount(GRP.choices)+1,6)))); } route(); return; }
  if(a==="copylinkar"){ copy($(".code[style*='break-all']").textContent+"&lang=ar", b); return; }
  if(a==="snd"){ const on=!soundEnabled(); save("l5.snd",on); if(on) sfx("ping"); route(); return; }
  if(a==="pinok"){ if($("[data-act=pin]").value.trim()===FAC_PIN){ sessionStorage.setItem("l5.ok","1"); sfx("unlock"); location.hash=b.dataset.target; route(); } else { sfx("error"); $("#pinmsg").textContent=trText("Wrong code."); } return; }
  if(a==="newsession"){ if(confirm(trText("Create a new session code? Groups will need the new link."))){ FAC.session=randSession(); saveFac(); syncStop(); route(); } return; }
  if(a==="proj"){ FAC.proj=!FAC.proj; saveFac(); route(); return; }
  if(a==="apply"){ const lines=$("[data-act=paste]").value.split(/\n/); let ok=0; lines.forEach(l=>{const c=fromCode(l); if(c && c.n>=1 && c.n<=8){ FAC.groups=Math.max(FAC.groups,c.n); FAC.choices[c.n]=c.ch; ok++; }}); saveFac(); route(); if(!ok) alert(trText("No valid codes found. Use the form G3-BCA.")); else Object.keys(FAC.choices).forEach(g=>syncSend({t:"set",g:+g,ch:FAC.choices[g].map(x=>x||"-").join("")})); return; }
  if(a==="export"){ copy(JSON.stringify(FAC), b); return; }
  if(a==="reset"){ if(confirm(trText("Reset the whole facilitator session? A new session code is created."))){ FAC={session:randSession(),groups:5,cur:1,reveal:REVEAL_DEFAULT,codes:true,proj:false,choices:{},online:{}}; saveFac(); syncStop(); route(); } return; }
  if(a==="join"){ const n=+$("[data-act=gnum]").value, s=$("[data-act=gsession]").value.trim(); if(!s){ alert(trText("Enter the session code.")); return; } GRP={n,session:s,reveal:GRP.reveal||REVEAL_DEFAULT,codes:GRP.codes!==false,choices:[],unlocked:0,notes:{},sent:{},splashed:{},warned:{}}; saveGrp(); sfx("join"); route(); syncSend({t:"hello",g:n}); return; }
  if(a==="gcopy"){ copy(toCode(GRP.n,GRP.choices), b); return; }
  if(a==="gleave"){ if(confirm(trText("Leave this group and clear your choices on this device?"))){ GRP={n:null,session:GRP.session,reveal:GRP.reveal,codes:GRP.codes,choices:[],unlocked:0,notes:{},warned:{}}; saveGrp(); HOLD=false; const md=$("#alertmodal"); if(md) md.remove(); route(); } return; }
  if(a==="gsync"){ const s=prompt(trText("Paste the code from your facilitator (like G3-BCA):")); const c=fromCode(s); if(c){ GRP.choices=c.ch; GRP.unlocked=Math.max(GRP.unlocked,doneCount(c.ch)+(GRP.codes?0:1)); saveGrp(); route(); } else if(s) alert(trText("That code is not valid.")); return; }
  if(a==="unlock"){ const r=doneCount(GRP.choices)+1, v=$("[data-act=gcode]").value.trim(); if(!GRP.codes || v===roundCode(GRP.session,r)){ GRP.unlocked=r; saveGrp(); sfx("unlock"); route(); } else { sfx("error"); $("#gmsg").textContent=trText("That code is not right. Check with your facilitator."); } return; }
  if(a==="pick"){ GRP.pick=b.dataset.l; saveGrp(); sfx("pick",LETTERS.indexOf(b.dataset.l)); route(); return; }
  if(a==="lock"){ const i=doneCount(GRP.choices); GRP.choices[i]=GRP.pick; const letter=GRP.pick; GRP.pick=null; saveGrp(); SHOW_RESULT=true; route(); syncSend({t:"choice",g:GRP.n,r:i+1,c:letter}).then(ok=>{ GRP.sent=GRP.sent||{}; GRP.sent[i+1]=!!ok; saveGrp(); const el=$("#sentnote"); if(el) el.textContent=trText(sentText(i,GRP.choices)); }); return; }
  if(a==="next"){ e.preventDefault(); SHOW_RESULT=false; route(); return; }
  if(a==="copynotes"){ const N=GRP.notes; copy(`Group ${GRP.n}\nWHAT?\n${N.what||""}\n\nSO WHAT?\n${N.sowhat||""}\n\nNOW WHAT?\n${N.nowwhat||""}\n\nKEEP: ${N.keep||""}\nSTOP: ${N.stop||""}\nSTART: ${N.start||""}`, b); return; }
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act;
  if(a==="cell"){ const g=+el.dataset.g; facChoices(g)[+el.dataset.i]=el.value||null; saveFac(); route(); syncSend({t:"set",g,ch:facChoices(g).map(x=>x||"-").join("")}); }
  else if(a==="groups"){ FAC.groups=+el.value; saveFac(); route(); }
  else if(a==="session"){ FAC.session=el.value.trim()||randSession(); saveFac(); syncStop(); route(); }
  else if(a==="reveal"){ FAC.reveal=+el.value; saveFac(); route(); syncSend({t:"settings",reveal:FAC.reveal,codes:FAC.codes}); }
  else if(a==="codes"){ FAC.codes=el.value==="1"; saveFac(); route(); syncSend({t:"settings",reveal:FAC.reveal,codes:FAC.codes}); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.matches("[data-act=pin]")) $("[data-act=pinok]").click(); });
document.addEventListener("input",e=>{ const el=e.target.closest("[data-act=note]"); if(el){ GRP.notes[el.dataset.k]=el.value; saveGrp(); } });
window.L5 = {STATS, totals, toCode, fromCode, roundCode, topicOf, DATA, get FAC(){return FAC;}, get GRP(){return GRP;}, get SYNC(){return SYNC;}};
route();
</script>
</body>
</html>
